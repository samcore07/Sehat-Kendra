<!-- ============ APP HEADER (always visible) ============ -->
<header class="app-header" id="appHeader">
  <div class="brand" onclick="goHome()">
    <div class="brand-mark">
  <img id="brandLogo" src="logo.png" alt="Brand Logo" style="height: 1em; width: auto; display: inline-block; vertical-align: middle;">
</div>
    <div class="brand-text">
      <div class="brand-en">SEHAT KENDRA <span class="brand-hi">सेहत केंद्र</span></div>
      <div class="brand-sub" data-i18n="brandSub">National Digital Health Gateway</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle light / dark mode">🌙</button>
    <div id="preAuthActions">
      <button class="btn btn-outline" data-i18n="signInBtn" onclick="showScreen('screen-role')">👤 Citizen Sign-in</button>
    </div>
    <nav class="app-nav hidden" id="postAuthNav">
      <a href="#" data-i18n="navHome" onclick="goHome();return false;">▦ Patient Home</a>
      <span class="guest-pill" id="guestPill" data-i18n="guestPill">☀ Guest Citizen</span>
      <a href="#" data-i18n="navLogout" onclick="logout();return false;">Logout</a>
    </nav>
</header>
