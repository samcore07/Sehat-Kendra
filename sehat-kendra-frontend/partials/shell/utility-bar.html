<!-- ============ TOP UTILITY BAR ============ -->
<div class="utility-bar" id="utilityBar">
  <div class="utility-left">
    <span data-i18n="phone">📞 1800-11-4477 (Toll Free)</span>
    <span class="dot">•</span>
    <span data-i18n="govLine">Government of India · National Health Authority</span>
  </div>
  <div class="utility-right">
    <div class="a11y-fontsize" role="group" aria-label="Adjust text size">
      <button type="button" class="font-btn" data-size="sm" onclick="setFontSize('sm')" title="Decrease text size">A-</button>
      <span class="font-sep">|</span>
      <button type="button" class="font-btn active" data-size="md" onclick="setFontSize('md')" title="Default text size">A</button>
      <span class="font-sep">|</span>
      <button type="button" class="font-btn" data-size="lg" onclick="setFontSize('lg')" title="Increase text size">A+</button>
    </div>
    <span class="dot">•</span>
    <button type="button" class="contrast-toggle" id="contrastToggleBtn" onclick="toggleContrast()" title="Toggle high contrast mode">
      <span class="contrast-icon" id="contrastIcon" aria-hidden="true">◐</span> Contrast
    </button>
    <span class="dot">•</span>
    <div class="lang-quick" role="group" aria-label="Quick language select">
      <a href="#" data-lang="en" class="lang-link active" onclick="quickSelectLanguage('en', this); return false;">English</a>
      <span class="lang-sep">|</span>
      <a href="#" data-lang="bn" class="lang-link" onclick="quickSelectLanguage('bn', this); return false;">বাংলা</a>
      <span class="lang-sep">|</span>
      <a href="#" data-lang="hi" class="lang-link" onclick="quickSelectLanguage('hi', this); return false;">हिंदी</a>
    </div>
  </div>
</div>
